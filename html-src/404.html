<!DOCTYPE html>

<head>

  <meta name="description" content="页面走丢了——回到 Yance 的个人主页。">
  <meta name="theme-color" content="__THEME_COLOR_LIGHT__" data-theme-light="__THEME_COLOR_LIGHT__" data-theme-dark="__THEME_COLOR_DARK__">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' '__THEME_BOOTSTRAP_HASH__' '__THEME_ORBIT_BOOT_HASH__'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'">
  <meta name="robots" content="noindex">

  <link rel="manifest" href="/assets/site.webmanifest">
  <script>try { document.documentElement.dataset.js = 'true'; let saved = null; try { saved = localStorage.getItem('yance-theme') } catch (e) {} const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches; const theme = saved === 'dark' || saved === 'light' ? saved : (systemDark ? 'dark' : 'light'); document.documentElement.dataset.theme = theme; const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', theme === 'dark' ? meta.dataset.themeDark : meta.dataset.themeLight); const initialHash = window.location.hash; if (initialHash) { document.documentElement.dataset.initialHash = initialHash } } catch (e) {}</script>
  <script type="module" src="../src/main.ts"></script>

<body data-page="404" data-locale="zh-CN">
  <div id="app"></div>
  <script data-theme-orbit-boot>try { setTimeout(() => { if (document.documentElement.dataset.vueEnhanced !== 'true') document.documentElement.dataset.heroFallback = 'true' }, 1800); const root = document.documentElement; const meta = document.querySelector('meta[name="theme-color"]'); const sync = () => { const theme = root.dataset.theme === 'dark' ? 'dark' : 'light'; document.querySelectorAll('.theme-orbit[data-theme-copy]').forEach((button) => { let copy; try { copy = JSON.parse(button.getAttribute('data-theme-copy'))[theme] } catch (e) { return } if (!copy) return; button.classList.toggle('dark', theme === 'dark'); button.classList.toggle('light', theme === 'light'); const knob = button.querySelector('.orbit-knob'); if (knob) knob.classList.toggle('dark', theme === 'dark'); button.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false'); if (copy.aria) button.setAttribute('aria-label', copy.aria); if (copy.title) button.setAttribute('title', copy.title); const label = button.querySelector('.orbit-label'); if (label && copy.label) label.textContent = copy.label }) }; sync(); document.addEventListener('click', (event) => { const target = event.target instanceof Element ? event.target.closest('.theme-orbit') : null; if (!target || target.dataset.vueBound === 'true') return; const next = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('yance-theme', next) } catch (e) {} root.dataset.themeChanging = 'true'; root.dataset.theme = next; if (meta) meta.setAttribute('content', next === 'dark' ? meta.dataset.themeDark : meta.dataset.themeLight); sync(); requestAnimationFrame(() => requestAnimationFrame(() => { delete root.dataset.themeChanging })) }) } catch (e) {}</script>
  <noscript data-noscript-fallback="404"></noscript>
</body>
</html>
