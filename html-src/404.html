<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 · 迷路了 · Yance</title>
  <meta name="description" content="页面走丢了——回到 Yance 的个人主页。">
  <meta name="theme-color" content="__THEME_COLOR_LIGHT__">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' '__THEME_BOOTSTRAP_HASH__'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>try { const saved = localStorage.getItem('yance-theme'); const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches; if (saved === 'dark' || (!saved && systemDark)) document.documentElement.dataset.theme = 'dark' } catch (e) {}</script>
  <script type="module" src="../src/main.ts"></script>
</head>
<body data-page="404" data-locale="zh-CN">
  <div id="app"></div>
</body>
</html>
