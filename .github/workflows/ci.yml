name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Python tools
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install Python tools
        run: python -m pip install -r requirements-tools.txt
      - name: Lint source
        run: npm run lint
      - name: Typecheck Vue app
        run: npm run typecheck
      - name: Dead-code check
        run: npm run deadcode
      - name: Asset audit
        run: npm run audit:assets
      - name: Unit tests
        run: npm run unit
      - name: Generate sitemap
        run: npm run sitemap
      - name: Build site
        run: npm run build
      - name: Smoke test artifact
        run: npm run smoke
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser release smoke
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'
          PLAYWRIGHT_OUTPUT_DIR: test-results/release-smoke
        run: npm run test:e2e -- --project=chromium --workers=1 --grep "all archive pages boot and expose the main landmark"
