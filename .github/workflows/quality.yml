name: Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: 'Regenerate Linux visual baselines for manual review'
        required: false
        default: false
        type: boolean
      run_particle_stress:
        description: 'Run ten rounds of particle interactions on Linux'
        required: false
        default: false
        type: boolean
      run_pointer_stress:
        description: 'Run ten rounds of cursor and button interactions on Linux'
        required: false
        default: false
        type: boolean

      run_home_motion_stress:
        description: 'Run ten rounds of home reading and focus interactions on Linux'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-motion-stress:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_home_motion_stress == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit-desktop
            browser: webkit
          - project: webkit-mobile
            browser: webkit
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results/home-motion-stress-${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install system CJK fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
      - name: Build stress target
        run: npm run build
      - name: Smoke test stress target
        run: npm run smoke
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ten rounds of home reading and focus tests
        run: npm run test:e2e -- tests/e2e/home-scroll-motion.spec.ts --project=${{ matrix.project }} --workers=1 --grep 'native snap follows|native proximity|natural footer|history restores|cold restoration|focus during|focus reveals|immediate focus reveal|reveals remain' --repeat-each=10 --retries=0
      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-motion-stress-${{ matrix.project }}
          path: test-results/home-motion-stress-${{ matrix.project }}
          if-no-files-found: ignore
          include-hidden-files: true
  pointer-stress:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pointer_stress == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit-desktop
            browser: webkit
          - project: webkit-mobile
            browser: webkit
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results/pointer-stress-${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install system CJK fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
      - name: Build stress target
        run: npm run build
      - name: Smoke test stress target
        run: npm run smoke
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ten rounds of cursor and button tests
        run: npm run test:e2e -- tests/e2e/sitewide-cursor.spec.ts tests/e2e/motion-system.spec.ts tests/e2e/ui-primitives.spec.ts --project=${{ matrix.project }} --workers=1 --grep '@pointer-refinement' --repeat-each=10 --retries=0
      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pointer-stress-${{ matrix.project }}
          path: test-results/pointer-stress-${{ matrix.project }}
          if-no-files-found: ignore
          include-hidden-files: true
  particle-stress:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_particle_stress == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit-desktop
            browser: webkit
          - project: webkit-mobile
            browser: webkit
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results/particle-stress-${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install system CJK fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
      - name: Build stress target
        run: npm run build
      - name: Smoke test stress target
        run: npm run smoke
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ten rounds of particle interaction tests
        run: npm run test:e2e -- tests/e2e/home-hero-interaction.spec.ts --project=${{ matrix.project }} --workers=1 --grep '@particle-v2' --repeat-each=10 --retries=0
      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: particle-stress-${{ matrix.project }}
          path: test-results/particle-stress-${{ matrix.project }}
          if-no-files-found: ignore
          include-hidden-files: true
  visual-snapshot-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots == true }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results/snapshot-review
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install system CJK fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
          fc-match --format='%{family}\n' "Noto Sans CJK SC" | grep -F "Noto Sans CJK SC"
          fc-match --format='%{family}\n' "Noto Sans CJK TC" | grep -F "Noto Sans CJK TC"
      - name: Build screenshot target
        run: npm run build
      - name: Smoke test screenshot target
        run: npm run smoke
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate Linux visual baselines for review
        run: npm run test:e2e -- --project=chromium-visual --workers=2 --retries=0 --update-snapshots=all
      - name: Upload actual visual captures for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-visual-captures-review
          path: test-results/snapshot-review
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload independently generated visual baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-visual-snapshots-review
          path: tests/e2e/visual-snapshots/chromium-visual/linux
          if-no-files-found: error
  audit:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Python tools
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python tools
        run: python -m pip install -r scripts/requirements.txt
      - name: Install system CJK fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
          fc-match --format='%{family}\n' "Noto Sans CJK SC" | grep -F "Noto Sans CJK SC"
          fc-match --format='%{family}\n' "Noto Sans CJK TC" | grep -F "Noto Sans CJK TC"
      - name: Brand asset consistency
        run: npm run brand:assets:check
      - name: Repository hygiene
        run: npm run audit:repo
      - name: Asset release audit
        run: npm run audit:assets
      - name: Build audit target
        run: npm run build
      - name: Smoke test audit target
        run: npm run smoke
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Select Playwright Chromium for Lighthouse
        shell: bash
        run: |
          chrome_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Lighthouse quality budget
        run: npm run lighthouse
      - name: Lighthouse interaction budget
        run: npm run lighthouse:interactions
      - name: Chromium browser and axe quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/chromium
        run: npm run test:e2e -- --project=chromium --workers=4 --retries=0
      - name: WebKit desktop ScrollProgress quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-scroll-progress
        run: npm run test:e2e -- tests/e2e/scroll-progress.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop adaptive header quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-header
        run: npm run test:e2e -- tests/e2e/adaptive-header.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop motion system quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-motion
        run: npm run test:e2e -- tests/e2e/motion-system.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop English layout quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-english-layout
        run: npm run test:e2e -- tests/e2e/english-layout.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop site and axe quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-site
        run: npm run test:e2e -- tests/e2e/site.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop footer quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-footer
        run: npm run test:e2e -- tests/e2e/footer.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop UI primitive quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-primitives
        run: npm run test:e2e -- tests/e2e/ui-primitives.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop HomeHero geometry quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-home-hero
        run: npm run test:e2e -- tests/e2e/home-hero-layout.spec.ts tests/e2e/home-scroll-motion.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop HomeHero interaction quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-home-hero-interaction
        # Recovery deadlines measure one foreground browser's real clock, as
        # in the ten-round stress lane. Parallel pages compete for RAF delivery.
        run: npm run test:e2e -- tests/e2e/home-hero-interaction.spec.ts --project=webkit-desktop --workers=1 --retries=0
      - name: WebKit desktop sitewide cursor quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-sitewide-cursor
        run: npm run test:e2e -- tests/e2e/sitewide-cursor.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit desktop concert archive preservation
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-desktop-concert-archive
        run: npm run test:e2e -- tests/e2e/concert-archive-preservation.spec.ts --project=webkit-desktop --workers=4 --retries=0
      - name: WebKit mobile ScrollProgress quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-scroll-progress
        run: npm run test:e2e -- tests/e2e/scroll-progress.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile adaptive header quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-header
        run: npm run test:e2e -- tests/e2e/adaptive-header.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile motion system quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-motion
        run: npm run test:e2e -- tests/e2e/motion-system.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile English layout quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-english-layout
        run: npm run test:e2e -- tests/e2e/english-layout.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile site and axe quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-site
        run: npm run test:e2e -- tests/e2e/site.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile footer quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-footer
        run: npm run test:e2e -- tests/e2e/footer.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile UI primitive quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-primitives
        run: npm run test:e2e -- tests/e2e/ui-primitives.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile HomeHero geometry quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-home-hero
        run: npm run test:e2e -- tests/e2e/home-hero-layout.spec.ts tests/e2e/home-scroll-motion.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile HomeHero interaction quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-home-hero-interaction
        run: npm run test:e2e -- tests/e2e/home-hero-interaction.spec.ts --project=webkit-mobile --workers=1 --retries=0
      - name: WebKit mobile sitewide cursor quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-sitewide-cursor
        run: npm run test:e2e -- tests/e2e/sitewide-cursor.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: WebKit mobile concert archive preservation
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-mobile-concert-archive
        run: npm run test:e2e -- tests/e2e/concert-archive-preservation.spec.ts --project=webkit-mobile --workers=4 --retries=0
      - name: Chromium visual quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/visual
        shell: bash
        run: |
          if [ "${{ inputs.update_visual_snapshots }}" = "true" ]; then
            npm run test:e2e -- --project=chromium-visual --workers=2 --retries=0 --update-snapshots
          else
            npm run test:e2e -- --project=chromium-visual --workers=2 --retries=0
          fi
      - name: Firefox compatibility quality
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/firefox
        run: npm run test:e2e -- --project=firefox-desktop-smoke --workers=2 --retries=0
      - name: Android compatibility quality
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/android
        run: npm run test:e2e -- --project=chromium-android-smoke --workers=2 --retries=0
      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-audit-artifacts
          path: |
            .lighthouseci
            test-results
            playwright-report
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload refreshed visual baselines
        if: ${{ inputs.update_visual_snapshots == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-visual-snapshots
          path: tests/e2e/visual-snapshots/chromium-visual/linux
          if-no-files-found: error

  preference-render-sensitivity:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/test/phase2-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results/linux-preference-render-sensitivity
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
      - name: Build and install WebKit
        run: |
          npm run build
          npx playwright install --with-deps webkit
      - name: Generate isolated notification fault fixture
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          mkdirSync('.superpowers/preference-negative', { recursive: true })
          const hook = `
          test.beforeEach(async ({ page }) => {
            await page.addInitScript(() => {
              const NativeObserver = ResizeObserver
              window.ResizeObserver = class extends NativeObserver {
                constructor(callback: ResizeObserverCallback) {
                  super((entries, observer) => {
                    if (entries.some(entry => entry.target.classList.contains('pointer-motion-preference-sentinel'))) return
                    callback(entries, observer)
                  })
                }
              }
            })
          })
          `
          const source = readFileSync('tests/e2e/motion-system.spec.ts', 'utf8').replace("import { expect, test } from '@playwright/test'", "import { expect, test } from '@playwright/test'\n" + hook)
          writeFileSync('.superpowers/preference-negative/motion-system.spec.ts', source)
          writeFileSync('.superpowers/preference-negative.config.ts', "import { defineConfig } from '@playwright/test'\nimport base from '../config/playwright.config'\nexport default defineConfig({ ...base, testDir: './preference-negative', projects: [{ ...base.projects![1], testMatch: /motion-system\\.spec\\.ts/ }] })\n")
          NODE
      - name: Verify rendering cannot bypass missing JS notifications
        run: |
          set +e
          npx playwright test --config .superpowers/preference-negative.config.ts --project=webkit-desktop --workers=1 --grep 'notifications are missed' --retries=0 > sensitivity.log 2>&1
          sensitivity_code=$?
          set -e
          cat sensitivity.log
          test "$sensitivity_code" -eq 1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const log = readFileSync('sensitivity.log', 'utf8').replace(/\u001b\[[0-9;]*m/g, '')
          if (!log.includes('"active": "1"') || !log.includes('"height": "2px"') || !log.includes('Timeout 5000ms')) throw new Error('Expected JS cleanup sensitivity failure not observed')
          NODE
      - name: Verify original notifications over ten rounds
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/linux-preference-render-positive
        run: npm run test:e2e -- tests/e2e/motion-system.spec.ts --project=webkit-desktop --workers=4 --grep 'motion directives clear' --repeat-each=10 --retries=0
      - name: Upload sensitivity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-preference-render-sensitivity
          path: |
            test-results/linux-preference-render-sensitivity
            test-results/linux-preference-render-positive
            sensitivity.log
          include-hidden-files: true

  cold-fragment-render-sensitivity:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/test/phase2-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results/linux-cold-fragment-negative
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
      - name: Build and install WebKit
        run: |
          npm run build
          npx playwright install --with-deps webkit
      - name: Generate isolated navigation fault fixture
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          mkdirSync('.superpowers/cold-fragment-negative', { recursive: true })
          const hook = `
          test.beforeEach(async ({ page }) => {
            await page.addInitScript(() => {
              HTMLElement.prototype.scrollIntoView = () => {}
              window.scrollTo = () => {}
            })
          })
          `
          const source = readFileSync('tests/e2e/adaptive-header.spec.ts', 'utf8').replace('test.describe.configure({ retries: 0 })', 'test.describe.configure({ retries: 0 })\n' + hook)
          writeFileSync('.superpowers/cold-fragment-negative/adaptive-header.spec.ts', source)
          writeFileSync('.superpowers/cold-fragment-negative.config.ts', "import { defineConfig } from '@playwright/test'\nimport base from '../config/playwright.config'\nexport default defineConfig({ ...base, testDir: './cold-fragment-negative', projects: [{ ...base.projects![1], testMatch: /adaptive-header\\.spec\\.ts/ }] })\n")
          NODE
      - name: Verify screenshot cannot satisfy blocked fragment navigation
        run: |
          set +e
          npx playwright test --config .superpowers/cold-fragment-negative.config.ts --project=webkit-desktop --workers=1 --grep 'cold fragment' --retries=0 > cold-fragment-sensitivity.log 2>&1
          sensitivity_code=$?
          set -e
          cat cold-fragment-sensitivity.log
          test "$sensitivity_code" -eq 1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const log = readFileSync('cold-fragment-sensitivity.log', 'utf8').replace(/\u001b\[[0-9;]*m/g, '')
          if (!log.includes('"header": "resting"') || !log.includes('"visible": false') || !log.includes('Timeout 5000ms')) throw new Error('Expected blocked-navigation sensitivity failure not observed')
          NODE
      - name: Verify actual fragment navigation over ten rounds
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/linux-cold-fragment-positive
        run: npm run test:e2e -- tests/e2e/adaptive-header.spec.ts --project=webkit-desktop --project=webkit-mobile --workers=4 --grep 'cold fragment' --repeat-each=10 --retries=0
      - name: Upload fragment sensitivity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-cold-fragment-render-sensitivity
          path: |
            test-results/linux-cold-fragment-negative
            test-results/linux-cold-fragment-positive
            cold-fragment-sensitivity.log
          include-hidden-files: true

  concert-screenshot-diagnosis:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/test/phase2-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_PREVIEW: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results/linux-concert-screenshot-diagnosis
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
      - name: Build and install Chromium
        run: |
          npm run build
          npx playwright install --with-deps chromium
      - name: Generate focused screenshot observation
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          mkdirSync('.superpowers/concert-visual-diagnosis', { recursive: true })
          let source = readFileSync('tests/e2e/visual-matrix.spec.ts', 'utf8')
          source = source.replace("const routes = ['index', 'academics', 'honors', 'research', 'works', 'concerts'] as const", "const routes = ['concerts'] as const")
          source = source.replace(/const viewports = \[[\s\S]*?\] as const/, "const viewports = [{ name: 'desktop', width: 1440, height: 900 }] as const")
          source = source.replace("const themes = ['light', 'dark'] as const", "const themes = ['dark'] as const")
          const assertion = "await expect(page.locator('main#main')).toHaveScreenshot(`${route}-${theme}-desktop-main.png`, componentScreenshotOptions)"
          const observed = `
          const geometry = () => page.evaluate(() => ({
            scrollY: window.scrollY,
            viewport: [window.innerWidth, window.innerHeight],
            active: document.activeElement?.className,
            regions: ['main#main', '.site-nav', '.skip-link', '#concert-archive'].map(selector => {
              const rect = document.querySelector(selector)?.getBoundingClientRect()
              return rect ? [selector, rect.top, rect.bottom, rect.height] : null
            })
          }))
          console.log('CONCERT_BEFORE_MAIN', JSON.stringify(await geometry()))
          if (process.env.CONCERT_VIEWPOINT) {
            const top = Number(process.env.CONCERT_VIEWPOINT)
            await page.evaluate(value => window.scrollTo({ top: value, behavior: 'instant' }), top)
            await expect.poll(() => page.evaluate(() => window.scrollY)).toBe(top)
            console.log('CONCERT_CONTROLLED_VIEWPOINT', JSON.stringify(await geometry()))
          }
          try { ${assertion} }
          finally { console.log('CONCERT_AFTER_MAIN', JSON.stringify(await geometry())) }
          `
          if (!source.includes(assertion)) throw new Error('Original main screenshot assertion not found')
          source = source.replace(assertion, observed)
          writeFileSync('.superpowers/concert-visual-diagnosis/visual-matrix.spec.ts', source)
          writeFileSync('.superpowers/concert-visual-diagnosis.config.ts', "import { defineConfig } from '@playwright/test'\nimport base from '../config/playwright.config'\nexport default defineConfig({ ...base, testDir: './concert-visual-diagnosis', snapshotPathTemplate: process.cwd() + '/tests/e2e/visual-snapshots/{projectName}/{platform}/{testFilePath}/{arg}{ext}', projects: [base.projects![3]] })\n")
          NODE
      - name: Observe original screenshot assertions over ten rounds
        run: npx playwright test --config .superpowers/concert-visual-diagnosis.config.ts --project=chromium-visual --grep 'captures dark desktop' --workers=2 --repeat-each=10 --retries=0
      - name: Verify original baseline at the initial archive viewpoint
        if: ${{ !cancelled() }}
        env:
          CONCERT_VIEWPOINT: '985'
          PLAYWRIGHT_OUTPUT_DIR: test-results/linux-concert-viewpoint-985
        run: npx playwright test --config .superpowers/concert-visual-diagnosis.config.ts --project=chromium-visual --grep 'captures dark desktop' --workers=2 --repeat-each=10 --retries=0
      - name: Verify the shifted viewpoint reproduces the original failure
        if: ${{ !cancelled() }}
        env:
          CONCERT_VIEWPOINT: '1001'
          PLAYWRIGHT_OUTPUT_DIR: test-results/linux-concert-viewpoint-1001
        run: |
          set +e
          npx playwright test --config .superpowers/concert-visual-diagnosis.config.ts --project=chromium-visual --grep 'captures dark desktop' --workers=1 --retries=0 > concert-viewpoint.log 2>&1
          viewpoint_code=$?
          set -e
          cat concert-viewpoint.log
          test "$viewpoint_code" -eq 1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const log = readFileSync('concert-viewpoint.log', 'utf8')
          if (!log.includes('concerts-dark-desktop-main.png') || !log.includes('15158 pixels')) throw new Error('Original shifted screenshot failure not reproduced')
          NODE
      - name: Upload screenshot diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-concert-screenshot-diagnosis
          path: |
            test-results/linux-concert-screenshot-diagnosis
            test-results/linux-concert-viewpoint-985
            test-results/linux-concert-viewpoint-1001
            concert-viewpoint.log
          include-hidden-files: true
