name: Quality Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30deaf803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Python tools
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install Python tools
        run: python -m pip install -r requirements-tools.txt
      - name: Build audit target
        run: npm run build
      - name: Smoke test audit target
        run: npm run smoke
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Select Playwright Chromium for Lighthouse
        shell: bash
        run: |
          chrome_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Lighthouse quality budget
        run: npm run lighthouse
      - name: Lighthouse interaction budget
        run: npm run lighthouse:interactions
      - name: Browser and axe quality matrix
        run: npm run test:e2e -- --workers=2
      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-audit-artifacts
          path: |
            .lighthouseci
            test-results
            playwright-report
          if-no-files-found: ignore
