name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Python tools
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install Python tools
        run: python -m pip install -r requirements-tools.txt
      - name: Lint source
        run: npm run lint
      - name: Typecheck Vue app
        run: npm run typecheck
      - name: Dead-code check
        run: npm run deadcode
      - name: Asset release audit
        run: npm run audit:assets
      - name: Unit tests
        run: npm run unit
      - name: Generate sitemap
        run: npm run sitemap
      - name: Build site
        run: npm run build
      - name: Smoke test artifact
        run: npm run smoke
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Select Playwright Chromium for Lighthouse
        shell: bash
        run: |
          chrome_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Lighthouse quality budget
        run: npm run lighthouse
      - name: Lighthouse interaction budget
        run: npm run lighthouse:interactions
      - name: Browser and axe tests
        run: npm run test:e2e -- --workers=2
      - name: Upload browser review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-review-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
