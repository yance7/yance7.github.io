name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Typecheck Vue app
        run: npm run typecheck
      - name: Dead-code check
        run: npm run deadcode
      - name: Unit tests
        run: npm run unit
      - name: Generate sitemap
        run: npm run sitemap
      - name: Build site
        run: npm run build
      - name: Smoke test artifact
        run: npm run smoke
      - name: Lighthouse quality budget
        run: npm run lighthouse
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Browser and axe tests
        run: npm run test:e2e -- --workers=2
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
