<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">FreshEye product view</title>
  <desc id="desc">A compact dashboard showing a fish-eye freshness result, confidence and explainability panel.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B202B"/>
      <stop offset="1" stop-color="#123F49"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6DDED0"/>
      <stop offset="1" stop-color="#C8FFF2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031119" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="24" fill="#09151C"/>
  <rect x="26" y="26" width="848" height="568" rx="18" fill="url(#ocean)" stroke="#2A6872"/>
  <path d="M26 94h848" stroke="#2A6872"/>
  <circle cx="58" cy="60" r="7" fill="#E86E5F"/>
  <circle cx="82" cy="60" r="7" fill="#D6AE58"/>
  <circle cx="106" cy="60" r="7" fill="#6DDED0"/>
  <text x="132" y="66" fill="#B4D7D4" font-family="monospace" font-size="14" letter-spacing="2">FRESHEYE / LIVE INFERENCE</text>
  <rect x="56" y="128" width="462" height="406" rx="14" fill="#102C35" stroke="#27545E"/>
  <circle cx="286" cy="310" r="148" fill="#071920" stroke="#6DDED0" stroke-width="3"/>
  <circle cx="286" cy="310" r="112" fill="#153F4B"/>
  <ellipse cx="286" cy="310" rx="82" ry="102" fill="#3E7680" opacity=".72"/>
  <ellipse cx="286" cy="310" rx="60" ry="80" fill="#93CFC7" opacity=".55"/>
  <circle cx="286" cy="310" r="35" fill="#122C34"/>
  <circle cx="274" cy="298" r="10" fill="#D4FFF5" opacity=".8"/>
  <path d="M145 488h282" stroke="#3D7880" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="80" y="164" fill="#9FCAC5" font-family="monospace" font-size="13" letter-spacing="1.5">INPUT / FISH EYE IMAGE</text>
  <text x="80" y="511" fill="#6DDED0" font-family="monospace" font-size="13" letter-spacing="1.5">GRAD-CAM ACTIVE</text>
  <rect x="552" y="128" width="264" height="406" rx="14" fill="#F4F4ED" filter="url(#shadow)"/>
  <text x="582" y="174" fill="#607079" font-family="monospace" font-size="12" letter-spacing="1.5">ASSESSMENT</text>
  <text x="582" y="230" fill="#10252B" font-family="sans-serif" font-size="32" font-weight="700">Fresh</text>
  <text x="582" y="259" fill="#60817F" font-family="monospace" font-size="13">PREDICTED GRADE</text>
  <rect x="582" y="296" width="204" height="9" rx="4" fill="#DDE7E2"/>
  <rect x="582" y="296" width="178" height="9" rx="4" fill="url(#aqua)"/>
  <text x="582" y="346" fill="#10252B" font-family="sans-serif" font-size="28" font-weight="700">99.29%</text>
  <text x="582" y="373" fill="#60817F" font-family="monospace" font-size="12">CONFIDENCE</text>
  <line x1="582" y1="407" x2="786" y2="407" stroke="#D8E0DA"/>
  <text x="582" y="438" fill="#607079" font-family="monospace" font-size="12" letter-spacing="1">REPORT READY</text>
  <text x="582" y="476" fill="#147A73" font-family="monospace" font-size="13">PDF EXPORT  ↗</text>
</svg>
